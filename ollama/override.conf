#/etc/systemd/system/ollama.service.d/override.conf
[Service]
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_HOST=0.0.0.0:11434"
#customization 12gb vram 32gb ram free memory
# Weights stay in VRAM (fast); Ollama auto-offloads overflow layers (KV + weights)
# to RAM when the 64k context exceeds 12GB VRAM, extending context without touching
# normal-size sessions. Flash attention + q8 KV shrink KV cache so more stays in VRAM.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_CONTEXT_LENGTH=65536"
# Not supported in Ollama 0.32.5 (ignored silently) — removed:
#   OLLAMA_CPU_OFFLOAD=32  (would push weights to CPU, slowing every token)
#   OLLAMA_MAX_RAM=32GB    (no such env var)
#   OLLAMA_VRAM_OVERCOMMIT=1 (no such env var; spill is automatic)